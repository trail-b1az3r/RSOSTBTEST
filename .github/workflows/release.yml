name: release

# Publishing to PyPI uses trusted publishing (OIDC): no API token is stored.
#
#   * Push a tag vX.Y.Z (equal to RUNNER_VERSION in src/rsostb/version.py):
#     verify -> build -> publish to PyPI -> install it back from PyPI ->
#     GitHub Release.
#   * Run manually with publish=validate (the default): the same pipeline,
#     except that instead of uploading it asks PyPI for an upload token and
#     throws it away. That proves PyPI trusts this workflow, repository and
#     environment, without publishing anything.
#   * Run manually with publish=pypi: publish. The version input decides the tag:
#       auto    never creates a tag. It publishes into the GitHub release
#               v<RUNNER_VERSION> made beforehand: one that has its tag and
#               no files yet. Without one, the run stops and says so.
#       vX.Y.Z  must equal RUNNER_VERSION. An existing tag is used; otherwise
#               the run creates it on the commit it verified and built, just
#               before the upload, and the release with the files after it.
#     Either way the tag's commit must declare that RUNNER_VERSION.
#
# The PyPI trusted publisher must name: owner trail-b1az3r, repository
# RSOSTBTEST, workflow release.yml, environment pypi (or the repository
# variable PYPI_ENVIRONMENT, if set), project RSOSTB.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "validate = everything except the upload (checks the PyPI trusted publisher); pypi = publish"
        type: choice
        options: [validate, pypi]
        default: validate
      version:
        description: "auto = publish into the existing empty release with tag v<RUNNER_VERSION> (creates no tag); vX.Y.Z = that version, creating its tag on this commit if there is none"
        required: true
        type: string
        default: auto

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      package: ${{ steps.plan.outputs.package }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      sha: ${{ steps.plan.outputs.sha }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: plan
        env:
          REQUESTED: ${{ inputs.publish }}
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # RUNNER_VERSION as declared at a commit: what a build of that commit is called.
          runner_version() {
            git show "$1:src/rsostb/version.py" | python3 -c 'import re, sys; print(re.search(r"^RUNNER_VERSION = \"([^\"]+)\"", sys.stdin.read(), re.M).group(1))'
          }
          stop() { echo "::error::$1"; printf '### Release stopped\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          has_tag() { git rev-parse -q --verify "refs/tags/$1" >/dev/null; }

          package=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          here=$(git rev-parse --short "$GITHUB_SHA")
          source_version=$(runner_version "$GITHUB_SHA")
          requested="${REQUESTED_VERSION:-auto}"
          create_tag=false
          how=""

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            mode=publish
            tag="$GITHUB_REF_NAME"
            ref="$tag"
            how="pushed"
          else
            if [ "$REQUESTED" = "pypi" ]; then mode=publish; else mode=validate; fi
            if [ "$requested" = "auto" ]; then
              # auto never creates a tag: it publishes into the release made for
              # this version on GitHub, which has its tag and no files yet.
              tag="v$source_version"
              create="Create it on GitHub (Releases > Draft a new release > tag $tag on a commit whose RUNNER_VERSION is $source_version > Publish release), or run with version $tag to have this workflow create the tag."
              if ! release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null); then
                problem="version auto publishes only into an existing release, and there is no published GitHub release $tag. $create"
              elif [ "$(jq '.assets | length' <<<"$release")" != 0 ]; then
                problem="release $tag already has files: it has been published. Bump RUNNER_VERSION for a new release."
              elif ! has_tag "$tag"; then
                problem="release $tag has no tag $tag in the repository. $create"
              else
                problem=""
              fi
              if [ -z "$problem" ]; then
                ref="$tag"
                how="existing empty release"
              elif [ "$mode" = publish ]; then
                stop "$problem"
              else
                echo "::warning::$problem (a validate run checks commit $here instead)"
                ref="$GITHUB_SHA"
                how="none yet; a publish run with auto would stop"
              fi
            else
              version="${requested#v}"
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || stop "version must be auto or vX.Y.Z, not '$requested'."
              tag="v$version"
              [ "$version" = "$source_version" ] || stop "You asked for $tag, but RUNNER_VERSION on $here is $source_version. Set RUNNER_VERSION = \"$version\" in src/rsostb/version.py first, or run from the commit that has it."
              if has_tag "$tag"; then
                ref="$tag"
                how="existing tag"
              else
                ref="$GITHUB_SHA"
                if [ "$mode" = publish ]; then
                  create_tag=true
                  how="created by this run on $here"
                else
                  how="none yet; a publish run would create it on $here"
                fi
              fi
            fi
          fi

          sha=$(git rev-parse "${ref}^{commit}")
          version="${tag#v}"
          built_version=$(runner_version "$sha")
          [ "$built_version" = "$version" ] || stop "$tag is on ${sha:0:7}, where RUNNER_VERSION is $built_version, not $version, so its package would be $built_version. Delete the release and the tag $tag, and make them again on a commit whose RUNNER_VERSION is $version."
          if [ "$mode" = publish ] && [ "$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$package/$version/json")" = 200 ]; then
            stop "$package $version is already on PyPI, which never takes the same version twice. Bump RUNNER_VERSION."
          fi

          {
            echo "mode=$mode"
            echo "version=$version"
            echo "package=$package"
            echo "tag=$tag"
            echo "ref=$ref"
            # The commit itself: GitHub refuses a tag name as a release's target_commitish.
            echo "sha=$sha"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"
          echo "### Release plan: **$mode** $package $version · tag \`$tag\` ($how) · commit \`${sha:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - run: rsostb task lint
      - run: rsostb version check
      - run: rsostb dataset build --check
      - run: rsostb selfcheck --sandbox process --require-execution --workers 4 --quiet
      - run: python -m pytest -m "not space" -q --timeout=900

  build:
    needs: [plan, verify]
    uses: ./.github/workflows/build.yml
    with:
      # The commit verify tested, not the one the run was started from: for
      # 1.0.3 the tag was on 1444d02 and the run on 53144b0, so the tested
      # and the published code differed.
      ref: ${{ needs.plan.outputs.sha }}

  pypi:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ vars.PYPI_ENVIRONMENT || 'pypi' }}
      url: https://pypi.org/project/${{ needs.plan.outputs.package }}/
    permissions:
      id-token: write          # trusted publishing; no API token stored
      contents: write          # to create the tag of an explicit new version
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      PACKAGE: ${{ needs.plan.outputs.package }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: The built files are this version
        run: |
          ls -l dist
          # Built files use the normalized name: RSOSTB -> rsostb, a-b.c -> a_b_c
          stem=$(echo "$PACKAGE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/_/g')
          test -f "dist/${stem}-${VERSION}-py3-none-any.whl" || { echo "::error::no wheel for $PACKAGE $VERSION in dist/"; exit 1; }
          test -f "dist/${stem}-${VERSION}.tar.gz" || { echo "::error::no sdist for $PACKAGE $VERSION in dist/"; exit 1; }
          test "$(ls dist | wc -l)" -eq 2 || { echo "::error::unexpected files in dist/"; exit 1; }

      - name: The version is not already on PyPI
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PACKAGE/$VERSION/json")
          if [ "$code" = "200" ]; then
            msg="$PACKAGE $VERSION is already on PyPI, which never accepts the same version twice; bump RUNNER_VERSION."
            if [ "$MODE" = "publish" ]; then echo "::error::$msg"; exit 1; else echo "::warning::$msg"; fi
          else
            echo "$PACKAGE $VERSION is not on PyPI yet (HTTP $code)."
          fi

      - name: Trusted publisher check (validate mode; uploads nothing)
        if: env.MODE == 'validate'
        run: |
          python3 - <<'EOF'
          import base64, json, os, sys, urllib.error, urllib.request

          package = os.environ["PACKAGE"]

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def project_exists():
              try:
                  urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json", timeout=30)
                  return True
              except urllib.error.HTTPError as exc:
                  return exc.code != 404

          if "ACTIONS_ID_TOKEN_REQUEST_URL" not in os.environ:
              fail("no OIDC token available: the job needs `permissions: id-token: write`")
          existed = project_exists()
          audience = json.load(urllib.request.urlopen("https://pypi.org/_/oidc/audience", timeout=30))["audience"]
          request = urllib.request.Request(
              f"{os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']}&audience={audience}",
              headers={"Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"})
          oidc = json.load(urllib.request.urlopen(request, timeout=30))["value"]
          print(f"::add-mask::{oidc}")
          payload = oidc.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          workflow = (claims.get("job_workflow_ref") or claims.get("workflow_ref") or "").split("@")[0].rsplit("/", 1)[-1]
          rows = [("Owner", claims.get("repository_owner")),
                  ("Repository name", (claims.get("repository") or "").split("/")[-1]),
                  ("Workflow name", workflow),
                  ("Environment name", claims.get("environment") or "(none)"),
                  ("PyPI project name", package)]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("#### What this run presents to PyPI\n\n| PyPI publisher field | Value |\n|---|---|\n")
              summary.writelines(f"| {k} | `{v}` |\n" for k, v in rows)
          for k, v in rows:
              print(f"  {k}: {v}")

          body = json.dumps({"token": oidc}).encode()
          try:
              reply = json.load(urllib.request.urlopen(urllib.request.Request(
                  "https://pypi.org/_/oidc/mint-token", data=body,
                  headers={"Content-Type": "application/json"}), timeout=30))
          except urllib.error.HTTPError as exc:
              try:
                  errors = json.loads(exc.read()).get("errors") or []
              except ValueError:
                  errors = []
              reasons = "; ".join(f"{e.get('code')}: {e.get('description')}" for e in errors) or f"HTTP {exc.code}"
              fail(f"PyPI does not accept this workflow as a trusted publisher for {package} ({reasons}). "
                   "Compare the values above with the publisher on PyPI (project → Publishing).")
          if reply.get("token"):
              print(f"::add-mask::{reply['token']}")   # short-lived; never used or printed
          print(f"PyPI accepts this workflow as a trusted publisher for {package}. Nothing was uploaded.")
          if not existed and project_exists():
              print(f"::notice::{package} was a pending publisher; PyPI created the (empty) project on this first "
                    "use, exactly as it would have on the first release. The name is now reserved for you.")
          EOF

      - name: Create the tag (an explicit new version only; auto never creates one)
        if: env.MODE == 'publish' && needs.plan.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          # On the commit verify tested and build packaged, before anything is
          # published, so the release on PyPI always has its tag. A tag made
          # with the workflow token does not start another release run.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          echo "Created tag $TAG on $SHA." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to PyPI
        if: env.MODE == 'publish'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  pypi-smoke:
    needs: [plan, pypi]
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PACKAGE: ${{ needs.plan.outputs.package }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the release from PyPI (outside any checkout)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          for attempt in $(seq 1 30); do
            pip install --no-cache-dir "$PACKAGE==$VERSION" && break
            echo "not on the index yet (attempt $attempt); waiting"; sleep 20
          done
          cd "$RUNNER_TEMP"
          rsostb --version | tee version.txt
          grep -q "rsostb $VERSION" version.txt
          rsostb info
          rsostb benchmark --adapter noisy-oracle --model pypi-smoke --categories math --limit-per-category 5 \
            --sandbox process --output smoke.jsonl --quiet
          rsostb validate smoke.jsonl --rescore

  github-release:
    needs: [plan, pypi]
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          # The tag exists by now (pushed, made by hand with an empty release,
          # or created by the pypi job). This creates the release if there is
          # none and attaches the files. target_commitish is the commit's SHA:
          # updating a release made by hand fails with "target_commitish
          # invalid" when given a tag name (1.0.2, 1.0.3).
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          files: dist/*
          generate_release_notes: true
