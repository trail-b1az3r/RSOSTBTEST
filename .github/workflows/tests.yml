name: tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check src tests hf

  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4        # JavaScript code-execution tasks
        with:
          node-version: "20"
      - name: Toolchains
        run: g++ --version && node --version
      - run: pip install -e ".[dev]"
      - name: Unit tests (fast)
        run: python -m pytest -m "not slow and not space" -q --timeout=300 --cov=rsostb --cov-report=term-missing:skip-covered

  space:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,space]"
      - name: Space tests
        run: python -m pytest -m space -q
      - name: Staged Space bundle imports standalone
        run: |
          rsostb space stage --out build/space
          cd build/space
          RSOSTB_STORE_DIR="$RUNNER_TEMP/store" PYTHONPATH= python -c "import app; print(len(app.STORE.entries()), 'seed entries')"
